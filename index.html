<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FF14 · 理符计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #fdf2f8; padding: 20px; color: #4a1942; min-height: 100vh; }
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        .container { max-width: 1400px; margin: 0 auto; background: rgba(255,245,249,.85); border-radius: 24px; padding: 24px 28px 40px; border: 1px solid #fce4ec; transition: background .15s; position: relative; z-index: 1; }
        h1 { text-align: center; font-size: 28px; color: #880e4f; margin-bottom: 20px; }
        h1::before { content: '🌸 '; }

        .controls { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: center; background: rgba(252,228,236,.85); padding: 16px 20px; border-radius: 16px; border: 1px solid #f8bbd0; margin-bottom: 24px; transition: background .15s; }
        .input-group { display: flex; align-items: center; gap: 8px; }
        .input-group label { font-weight: 600; font-size: 14px; color: #880e4f; white-space: nowrap; }
        .input-group input, .input-group select { padding: 6px 12px; border: 2px solid #f48fb1; border-radius: 10px; font-size: 14px; background: rgba(255,255,255,.8); color: #4a1942; outline: none; transition: .2s; }
        .input-group input:focus, .input-group select:focus { border-color: #e91e63; box-shadow: 0 0 0 3px rgba(233,30,99,.15); }
        .input-group input { width: 90px; }
        .input-group select { width: 130px; cursor: pointer; }

        .btn { background: #e91e63; color: #fff; border: none; padding: 8px 22px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: .2s; }
        .btn:hover { background: #c2185b; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(233,30,99,.3); }
        .btn:active { transform: scale(.97); }
        .btn-sm { padding: 4px 14px; font-size: 13px; }
        .btn-export { background: #2e7d32; }
        .btn-export:hover { background: #1b5e20; }

        .slider-group { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.4); padding: 4px 12px; border-radius: 20px; border: 1px solid #f8bbd0; }
        .slider-group label { font-weight: 600; font-size: 13px; color: #880e4f; white-space: nowrap; }
        .slider-group input[type="range"] { width: 100px; accent-color: #e91e63; cursor: pointer; }
        .slider-group .val { font-weight: 700; color: #c2185b; min-width: 32px; text-align: center; }

        .stats { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; background: rgba(252,228,236,.85); padding: 12px 20px; border-radius: 14px; border: 1px solid #f8bbd0; margin-bottom: 16px; font-size: 15px; transition: background .15s; }
        .stats span { font-weight: 700; color: #880e4f; }
        .stats .num { color: #c2185b; font-size: 18px; }
        .stats .gold { color: #e65100; font-size: 18px; }

        .shout { background: rgba(252,228,236,.85); border: 2px solid #f48fb1; border-radius: 12px; padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; transition: background .15s; }
        .shout textarea { flex: 1; min-width: 200px; padding: 8px 14px; border: 2px solid #f48fb1; border-radius: 10px; font-size: 14px; font-family: inherit; background: rgba(255,255,255,.8); resize: vertical; min-height: 50px; color: #4a1942; transition: background .15s; }
        .shout textarea:focus { border-color: #e91e63; outline: none; }

        .table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid #f8bbd0; background: rgba(255,255,255,.85); transition: background .15s; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1200px; }
        th { background: rgba(252,228,236,.85); text-align: left; padding: 10px 12px; font-weight: 700; color: #880e4f; position: sticky; top: 0; border-bottom: 2px solid #f48fb1; transition: background .15s; z-index: 2; }
        td { padding: 8px 12px; border-top: 1px solid #fce4ec; vertical-align: middle; position: relative; }
        tr:hover td { background: rgba(253,242,248,.5); }
        .exp { color: #c2185b; font-weight: 600; }
        .gld { color: #e65100; font-weight: 600; }
        .cnt { text-align: center; font-weight: 700; font-size: 15px; color: #880e4f; }
        .rng { font-size: 12px; color: #7a4a6a; }

        .item-cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; color: #7a4a6a; }
        .item-cell .copy-btn { background: #f48fb1; color: #fff; border: none; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; transition: .2s; white-space: nowrap; line-height: 1.4; display: inline-flex; align-items: center; justify-content: center; }
        .item-cell .copy-btn:hover { background: #e91e63; }
        .item-cell .copy-btn:active { transform: scale(.95); }

        .task-wrapper { display: inline-block; position: relative; width: 100%; min-width: 160px; }
        .task-name-display { display: inline-block; width: 100%; padding: 2px 4px; font-weight: 500; color: #4a1942; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .task-select-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; background: transparent; font-size: 14px; -webkit-appearance: none; appearance: none; z-index: 1; }
        .task-select-overlay option { background: #fff5f9; color: #4a1942; padding: 4px 8px; font-weight: 400; white-space: normal; word-break: break-word; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(136,14,79,.35); z-index: 999; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal.active { display: flex; }
        .modal-card { background: rgba(255,245,249,.95); border-radius: 24px; max-width: 95%; width: 1300px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(233,30,99,.25); border: 1px solid #f8bbd0; overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 2px solid #f48fb1; flex-shrink: 0; }
        .modal-header h2 { font-size: 20px; color: #880e4f; }
        .modal-close { background: none; border: none; font-size: 30px; cursor: pointer; color: #ad1457; padding: 0 8px; line-height: 1; transition: .2s; }
        .modal-close:hover { color: #880e4f; transform: rotate(90deg); }
        .modal-body { padding: 16px 24px 24px; overflow-y: auto; flex: 1; }
        .modal-body table { min-width: 700px; }
        .badge { background: #f48fb1; border-radius: 20px; padding: 0 10px; font-size: 11px; font-weight: 700; color: #fff; display: inline-block; }

        .footer { display: none; }
        .status-msg { padding: 8px 16px; border-radius: 8px; font-size: 14px; margin-top: 8px; display: none; }
        .status-msg.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .status-msg.error { display: block; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

        .checkbox-group { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.4); padding: 4px 12px; border-radius: 20px; border: 1px solid #f8bbd0; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #e91e63; cursor: pointer; }
        .checkbox-group label { font-weight: 600; font-size: 13px; color: #880e4f; cursor: pointer; }

        @media (max-width:600px) {
            .container { padding: 16px; }
            h1 { font-size: 22px; }
            .controls { flex-direction: column; align-items: stretch; }
            .input-group { flex-wrap: wrap; }
            .input-group input { width: 80px; }
            .input-group select { width: 100%; }
            .stats { justify-content: space-between; }
            .shout { flex-direction: column; align-items: stretch; }
            .shout textarea { min-width: unset; }
            .btn { width: 100%; }
            .slider-group { justify-content: center; }
            .task-wrapper { min-width: 120px; }
            .item-cell { white-space: normal; }
        }
    </style>
</head>
<body>
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="雷电将军动态壁纸.mp4" type="video/mp4">
    </video>

    <div class="container" id="app">
        <h1>FF14 · 理符计算器</h1>

        <div class="controls" id="ctrlBar">
            <div class="input-group">
                <label>职业</label>
                <select id="profession">
                    <option value="刻木匠">刻木匠</option>
                    <option value="锻铁匠">锻铁匠</option>
                    <option value="铸甲匠">铸甲匠</option>
                    <option value="雕金匠">雕金匠</option>
                    <option value="制革匠">制革匠</option>
                    <option value="裁衣匠">裁衣匠</option>
                    <option value="炼金术士">炼金术士</option>
                    <option value="烹调师">烹调师</option>
                </select>
            </div>
            <div class="input-group">
                <label>起始</label>
                <input type="number" id="startLevel" value="1" min="1" max="99" />
            </div>
            <div class="input-group">
                <label>目标</label>
                <input type="number" id="targetLevel" value="100" min="1" max="100" />
            </div>
            <div class="input-group">
                <label>经验</label>
                <input type="number" id="currentExp" value="0" min="0" />
            </div>
            <div class="slider-group">
                <label>透明度</label>
                <input type="range" id="opacitySlider" min="0" max="1" step=".05" value=".85" />
                <span class="val" id="opacityVal">0.85</span>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="filterWholesale" />
                <label for="filterWholesale">屏蔽批发委托</label>
            </div>
            <button class="btn" id="viewAllBtn">📋 查看全部</button>
        </div>

        <div class="stats" id="statsBar">
            <div>折算起始：<span class="num" id="convertedLevel">—</span></div>
            <div>目标等级：<span class="num" id="targetLevelDisplay">—</span></div>
            <div>理符总次数：<span class="num" id="totalTasks">—</span></div>
            <div>获得金币：<span class="gold" id="totalGold">—</span></div>
            <div>剩余经验：<span class="num" id="remainExp">—</span></div>
            <button class="btn btn-sm" id="resetBtn">🔄 重置</button>
            <button class="btn btn-sm btn-export" id="exportBtn">📤 导出结果</button>
        </div>

        <div class="shout">
            <textarea id="shoutText" readonly></textarea>
            <button class="btn" id="copyShoutBtn">📋 复制喊话</button>
        </div>

        <div id="exportStatus" class="status-msg"></div>

        <div class="table-wrap" id="tableWrap">
            <table>
                <thead><tr><th>任务名称</th><th>接取地点</th><th>单次经验</th><th>单次金币</th><th>所需道具</th><th>道具数量</th><th>理符次数</th><th>金币小计</th><th>覆盖等级</th></tr></thead>
                <tbody id="resultBody"><tr><td colspan="9" style="text-align:center;padding:30px;color:#ad1457;">🌸 加载数据中...</td></tr></tbody>
            </table>
        </div>
        <div class="footer"></div>
    </div>

    <div class="modal" id="taskModal">
        <div class="modal-card">
            <div class="modal-header"><h2 id="modalTitle">📋 全部理符任务</h2><button class="modal-close" id="modalCloseBtn">&times;</button></div>
            <div class="modal-body" id="modalBody"><div style="text-align:center;padding:30px;color:#ad1457;">加载中...</div></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 职业中文名 → 英文Type 映射
        // ============================================================
        const PROFESSION_TYPE = {
            '刻木匠': 'Carpenter',
            '锻铁匠': 'Blacksmith',
            '铸甲匠': 'Armorer',
            '雕金匠': 'Goldsmith',
            '制革匠': 'Leatherworker',
            '裁衣匠': 'Weaver',
            '炼金术士': 'Alchemist',
            '烹调师': 'Culinarian'
        };

        // ============================================================
        // 升级经验表（1~100级）
        // ============================================================
        const EXP = [
            300, 450, 630, 970, 1440, 1940, 3000, 3920, 4970, 5900,
            7430, 8620, 10200, 11300, 13100, 15200, 17400, 19600, 21900, 24300,
            27400, 30600, 33900, 37300, 40800, 49200, 54600, 61900, 65600, 68400,
            74000, 82700, 88700, 95000, 102000, 113000, 121000, 133000, 142000, 155000,
            163000, 171000, 179000, 187000, 195000, 214000, 229000, 244000, 259000, 421000,
            500000, 580000, 663000, 749000, 837000, 927000, 1019000, 1114000, 1211000, 1387000,
            1456000, 1534000, 1621000, 1720000, 1834000, 1968000, 2126000, 2317000, 2550000, 2923000,
            3018000, 3153000, 3324000, 3532000, 3770000, 4066000, 4377000, 4777000, 5256000, 5992000,
            6171000, 6942000, 7205000, 7948000, 8287000, 9231000, 9529000, 10459000, 10838000, 13278000,
            13659000, 15348000, 15912000, 17534000, 18263000, 20322000, 20957000, 22979000, 23789000, 0
        ];

        // ============================================================
        // 职业数据
        // ============================================================
        let PD = {};
        let dataLoaded = false;
        let currentResult = null;

        const PROFESSION_FILES = {
            '刻木匠': 'data/kemu.json',
            '锻铁匠': 'data/duantie.json',
            '铸甲匠': 'data/zhujia.json',
            '雕金匠': 'data/diaojin.json',
            '制革匠': 'data/zhige.json',
            '裁衣匠': 'data/caiyi.json',
            '炼金术士': 'data/lianjin.json',
            '烹调师': 'data/chuzi.json'
        };

        let itemMap = {};

        async function loadItemMap() {
            try {
                const resp = await fetch('https://raw.githubusercontent.com/1519352147/ff14-tool/main/items.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        if (item.name && item.id !== undefined) {
                            itemMap[item.name] = Number(item.id);
                        }
                    });
                } else if (typeof data === 'object' && data !== null) {
                    if (data.name && data.id !== undefined) {
                        itemMap[data.name] = Number(data.id);
                    } else {
                        for (const [key, val] of Object.entries(data)) {
                            if (typeof val === 'number' || !isNaN(Number(val))) {
                                itemMap[key] = Number(val);
                            }
                        }
                    }
                }
                console.log(`✅ items.json 加载成功，共 ${Object.keys(itemMap).length} 个物品`);
            } catch (e) {
                console.warn('⚠️ 加载 items.json 失败，导出时将使用0代替ID', e);
                itemMap = {};
            }
        }

        async function loadProfessionData(profession) {
            const filePath = PROFESSION_FILES[profession];
            if (!filePath) {
                PD[profession] = {};
                return;
            }
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    console.warn(`数据文件 ${filePath} 不存在，使用空数据`);
                    PD[profession] = {};
                    return;
                }
                const data = await response.json();
                PD[profession] = data;
                console.log(`✅ 已加载 ${profession} 数据 (${Object.keys(data).length} 个等级)`);
            } catch (e) {
                console.warn(`加载 ${profession} 数据失败:`, e);
                PD[profession] = {};
            }
        }

        async function loadAllData() {
            const professions = Object.keys(PROFESSION_FILES);
            const promises = professions.map(p => loadProfessionData(p));
            await Promise.all(promises);
            dataLoaded = true;
            for (const p of professions) {
                if (!PD[p]) PD[p] = {};
            }
            render();
        }

        // ============================================================
        // 工具函数：解析道具名称和数量（兼容 "道具 x3"、"道具x3"、"道具 X3" 等）
        // ============================================================
        function parseItemName(raw) {
            // 匹配末尾的 x数字（忽略前后空格，不区分大小写）
            const match = raw.match(/^(.*?)(?:\s*[xX]\s*(\d+))$/);
            if (match) {
                return { name: match[1].trim(), quantity: parseInt(match[2]) };
            }
            // 如果没有匹配，整个字符串作为名称，数量为1
            return { name: raw.trim(), quantity: 1 };
        }

        // ============================================================
        // 核心逻辑
        // ============================================================
        let overrides = {};
        let filterWholesale = false;

        function getBest(level, data) {
            if (overrides[level]) {
                return { level: level, detail: overrides[level] };
            }
            let best = null, maxExp = 0;
            for (const [lv, tasks] of Object.entries(data)) {
                const lvNum = parseInt(lv);
                if (lvNum <= level) {
                    for (const t of tasks) {
                        if (filterWholesale && t[0].includes('批发委托')) continue;
                        const e = t[2] * 2;
                        if (e > maxExp) { maxExp = e; best = { level: lvNum, detail: t }; }
                    }
                }
            }
            return best;
        }

        function calc(startLv, targetLv, startExp, data) {
            let lv = startLv, cur = startExp;
            while (lv < targetLv && cur >= EXP[lv - 1]) { cur -= EXP[lv - 1]; lv++; }
            const converted = lv;
            if (lv >= targetLv) return { converted, target: targetLv, tasks: [], total: 0, remain: cur, gold: 0 };

            const map = new Map();
            let total = 0, gold = 0;
            while (lv < targetLv) {
                const need = EXP[lv - 1];
                const best = getBest(lv, data);
                if (!best) break;
                const e = best.detail[2] * 2, g = best.detail[3], name = best.detail[0];
                let cnt = 0;
                while (cur < need) { cur += e; cnt++; total++; gold += g; }
                cur -= need;
                if (map.has(name)) {
                    const entry = map.get(name);
                    entry.count += cnt;
                    if (lv < entry.start) entry.start = lv;
                    if (lv > entry.end) entry.end = lv;
                } else {
                    map.set(name, { count: cnt, start: lv, end: lv, detail: best.detail });
                }
                lv++;
            }
            const result = Array.from(map.entries()).map(([name, d]) => ({ name, ...d }));
            result.sort((a, b) => a.start - b.start);
            return { converted, target: targetLv, tasks: result, total, remain: cur, gold };
        }

        // ============================================================
        // 渲染
        // ============================================================
        function render() {
            const prof = document.getElementById('profession').value;
            const startLv = parseInt(document.getElementById('startLevel').value) || 1;
            const targetLv = parseInt(document.getElementById('targetLevel').value) || 100;
            const startExp = parseInt(document.getElementById('currentExp').value) || 0;

            const clampedStart = Math.min(Math.max(startLv, 1), 99);
            document.getElementById('startLevel').value = clampedStart;
            let clampedTarget = Math.min(Math.max(targetLv, 1), 100);
            if (clampedTarget < clampedStart) clampedTarget = clampedStart;
            document.getElementById('targetLevel').value = clampedTarget;

            const data = PD[prof];
            if (!data || !Object.keys(data).length) {
                ['convertedLevel', 'targetLevelDisplay', 'totalTasks', 'totalGold', 'remainExp'].forEach(id =>
                    document.getElementById(id).textContent = '—');
                document.getElementById('shoutText').value = '';
                document.getElementById('resultBody').innerHTML =
                    `<tr><td colspan="9" style="text-align:center;padding:30px;color:#ad1457;">🌸 该职业数据为空，请确保 data/${PROFESSION_FILES[prof]} 存在</td></tr>`;
                return;
            }

            const r = calc(clampedStart, clampedTarget, startExp, data);
            currentResult = r;

            document.getElementById('convertedLevel').textContent = r.converted;
            document.getElementById('targetLevelDisplay').textContent = r.target;
            document.getElementById('totalTasks').textContent = r.total.toLocaleString();
            document.getElementById('totalGold').textContent = r.gold.toLocaleString();
            document.getElementById('remainExp').textContent = r.remain.toLocaleString();
            document.getElementById('shoutText').value =
                `起始等级：${r.converted}，目标等级：${r.target}，理符总次数：${r.total}，获得金币：${r.gold.toLocaleString()}`;

            const tbody = document.getElementById('resultBody');
            if (!r.tasks.length) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:30px;color:#ad1457;">🌸 已满级或无可选任务</td></tr>`;
                return;
            }

            let html = '';
            for (const item of r.tasks) {
                const d = item.detail;
                const e = d[2] * 2, g = d[3];
                const range = item.start === item.end ? `${item.start}级` : `${item.start}～${item.end}级`;
                const repLevel = item.start;
                const rawItemName = d[4];
                const parsed = parseItemName(rawItemName);
                const displayName = parsed.name;
                const quantity = parsed.quantity;

                // 生成备选任务时也过滤批发委托
                const allTasks = [];
                for (const [lv, tasks] of Object.entries(data)) {
                    if (parseInt(lv) <= repLevel) {
                        for (const t of tasks) {
                            if (filterWholesale && t[0].includes('批发委托')) continue;
                            allTasks.push({ level: parseInt(lv), task: t });
                        }
                    }
                }
                allTasks.sort((a, b) => b.task[2] - a.task[2]);
                const hasAlternatives = allTasks.length > 1;

                let taskHtml;
                if (hasAlternatives) {
                    const selectId = `sel-${repLevel}-${Date.now()}-${Math.random()}`;
                    const currentName = d[0];
                    let optionsHtml = '';
                    for (const entry of allTasks) {
                        const t = entry.task;
                        const isSelected = (t[0] === d[0] && t[2] === d[2] && t[3] === d[3]);
                        const label = `[Lv.${entry.level}] ${t[0]} | 经验:${t[2]*2} | 金币:${t[3]} | ${t[1]} | 道具:${t[4]}`;
                        optionsHtml += `<option value='${JSON.stringify(t).replace(/'/g,"&#39;")}' ${isSelected ? 'selected' : ''}>${label}</option>`;
                    }
                    taskHtml = `
                        <div class="task-wrapper">
                            <span class="task-name-display">${currentName}</span>
                            <select class="task-select-overlay" data-level="${repLevel}" data-start="${item.start}" data-end="${item.end}" id="${selectId}">
                                ${optionsHtml}
                            </select>
                        </div>
                    `;
                } else {
                    taskHtml = `<span style="font-weight:500;">${d[0]}</span>`;
                }

                const copyBtn = `<button class="copy-btn" onclick="copyItem('${displayName.replace(/'/g,"\\'")}', this)">📋复制</button>`;
                const itemCell = `<span class="item-cell">${displayName} ${copyBtn}</span>`;

                html += `<tr>
                    <td>${taskHtml}</td>
                    <td style="font-size:12px;color:#7a4a6a;">${d[1]}</td>
                    <td class="exp">${e.toLocaleString()}</td>
                    <td class="gld">${g.toLocaleString()}</td>
                    <td>${itemCell}</td>
                    <td style="text-align:center;font-weight:600;">${quantity}</td>
                    <td class="cnt">${item.count}</td>
                    <td class="gld">${(g*item.count).toLocaleString()}</td>
                    <td class="rng">${range}</td>
                </tr>`;
            }
            tbody.innerHTML = html;

            tbody.querySelectorAll('.task-select-overlay').forEach(sel => {
                sel.addEventListener('change', function() {
                    const start = parseInt(this.dataset.start);
                    const end = parseInt(this.dataset.end);
                    try {
                        const task = JSON.parse(this.value.replace(/&#39;/g, "'"));
                        for (let lv = start; lv <= end; lv++) {
                            overrides[lv] = task;
                        }
                        render();
                    } catch (e) { console.error(e); }
                });
            });
        }

        // ============================================================
        // 导出功能（Amount = 任务次数 × 单次道具数量）
        // ============================================================
        function exportResult() {
            const statusEl = document.getElementById('exportStatus');
            statusEl.className = 'status-msg';
            statusEl.textContent = '';
            statusEl.style.display = 'none';

            if (!currentResult || !currentResult.tasks || currentResult.tasks.length === 0) {
                statusEl.className = 'status-msg error';
                statusEl.textContent = '❌ 没有可导出的结果，请先进行计算。';
                statusEl.style.display = 'block';
                return;
            }

            const prof = document.getElementById('profession').value;
            const type = PROFESSION_TYPE[prof] || 'Unknown';

            const exportData = currentResult.tasks.map((item) => {
                const rawItemName = item.detail[4];
                const parsed = parseItemName(rawItemName);
                const itemName = parsed.name;
                const quantity = parsed.quantity;
                let itemId = itemMap[itemName];
                if (itemId === undefined || itemId === null) {
                    console.warn(`⚠️ 未找到道具 "${itemName}" 的ID，将使用0`);
                    itemId = 0;
                }
                if (typeof itemId !== 'number') {
                    itemId = Number(itemId) || 0;
                }
                const totalAmount = item.count * quantity;
                return {
                    Group: 1,
                    Item: itemId,
                    Amount: totalAmount,
                    Enabled: true,
                    Type: type
                };
            });

            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            link.download = `理符结果_${prof}_${dateStr}.json`;
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            statusEl.className = 'status-msg success';
            statusEl.textContent = `✅ 导出成功！共 ${exportData.length} 条任务，文件: 理符结果_${prof}_${dateStr}.json (Amount为总道具数)`;
            statusEl.style.display = 'block';
            setTimeout(() => { statusEl.style.display = 'none'; }, 5000);
        }

        // ============================================================
        // 复制道具（仅复制纯净名称）
        // ============================================================
        function copyItem(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '✅';
                btn.style.background = '#e91e63';
                setTimeout(() => { btn.textContent = orig; btn.style.background = '#f48fb1'; }, 1200);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                const orig = btn.textContent;
                btn.textContent = '✅';
                setTimeout(() => { btn.textContent = orig; }, 1200);
            });
        }

        // ============================================================
        // 重置
        // ============================================================
        function resetOverrides() { overrides = {}; render(); }

        // ============================================================
        // 查看全部（也应用过滤）
        // ============================================================
        function showAll() {
            const prof = document.getElementById('profession').value;
            const data = PD[prof];
            const modal = document.getElementById('taskModal');
            const body = document.getElementById('modalBody');
            const title = document.getElementById('modalTitle');
            if (!data || !Object.keys(data).length) {
                title.textContent = `📋 ${prof} - 暂无数据`;
                body.innerHTML = `<div style="text-align:center;padding:30px;color:#ad1457;">该职业暂无数据，请确保 data/${PROFESSION_FILES[prof]} 存在</div>`;
                modal.classList.add('active');
                return;
            }
            title.textContent = `📋 ${prof} - 全部理符任务${filterWholesale ? ' (已屏蔽批发委托)' : ''}`;
            const levels = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));
            let html = `<table><thead><tr><th>等级</th><th>任务名称</th><th>接取地点</th><th>经验</th><th>金币</th><th>道具</th><th>数量</th></tr></thead><tbody>`;
            for (const lv of levels) {
                for (const t of data[lv] || []) {
                    if (filterWholesale && t[0].includes('批发委托')) continue;
                    const parsed = parseItemName(t[4]);
                    html += `<tr><td><span class="badge">Lv.${lv}</span></td><td>${t[0]}</td><td>${t[1]}</td><td>${t[2].toLocaleString()}</td><td>${t[3].toLocaleString()}</td><td>${parsed.name}</td><td>${parsed.quantity}</td></tr>`;
                }
            }
            html += `</tbody></table>`;
            body.innerHTML = html;
            modal.classList.add('active');
        }

        function copyShout() {
            const ta = document.getElementById('shoutText');
            ta.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyShoutBtn');
            const orig = btn.textContent;
            btn.textContent = '✅ 已复制';
            setTimeout(() => btn.textContent = orig, 1500);
        }

        // ============================================================
        // 透明度
        // ============================================================
        function setupOpacity() {
            const slider = document.getElementById('opacitySlider');
            const val = document.getElementById('opacityVal');
            const els = [
                document.getElementById('app'),
                document.getElementById('ctrlBar'),
                document.getElementById('statsBar'),
                document.querySelector('.shout'),
                document.getElementById('tableWrap')
            ];
            const ths = document.querySelectorAll('th');
            const inputs = document.querySelectorAll('input, select:not(.task-select-overlay), textarea');
            const modalCard = document.querySelector('.modal-card');

            slider.addEventListener('input', function() {
                const a = parseFloat(this.value);
                val.textContent = a.toFixed(2);
                const bg = (r, g, b) => `rgba(${r},${g},${b},${a})`;
                els[0].style.background = bg(255, 245, 249);
                els[1].style.background = bg(252, 228, 236);
                els[2].style.background = bg(252, 228, 236);
                els[3].style.background = bg(252, 228, 236);
                els[4].style.background = bg(255, 255, 255);
                ths.forEach(th => th.style.background = bg(252, 228, 236));
                inputs.forEach(el => el.style.background = bg(255, 255, 255));
                if (modalCard) modalCard.style.background = bg(255, 245, 249);
            });
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        document.getElementById('profession').addEventListener('change', render);
        document.getElementById('startLevel').addEventListener('input', render);
        document.getElementById('targetLevel').addEventListener('input', render);
        document.getElementById('currentExp').addEventListener('input', render);
        document.getElementById('viewAllBtn').addEventListener('click', showAll);
        document.getElementById('copyShoutBtn').addEventListener('click', copyShout);
        document.getElementById('resetBtn').addEventListener('click', resetOverrides);
        document.getElementById('exportBtn').addEventListener('click', exportResult);
        document.getElementById('modalCloseBtn').addEventListener('click', () =>
            document.getElementById('taskModal').classList.remove('active'));
        document.getElementById('taskModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) e.target.classList.remove('active');
        });

        document.getElementById('filterWholesale').addEventListener('change', function() {
            filterWholesale = this.checked;
            render();
        });

        setupOpacity();

        (async function init() {
            await loadItemMap();
            await loadAllData();
        })();
    </script>
</body>
</html>
